<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex"><meta name="theme-color" content="#FFE9A3"><link rel="manifest" href="data/manifest.json"><link rel="icon" href="data/ikon-192.png"><link rel="apple-touch-icon" href="data/ikon-192.png"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"></head><body><title>Kartu Bicara</title>
<meta name="description" content="Aplikasi komunikasi gambar (AAC) untuk anak, klinik Yamet">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
<style>
:root{--wall:#FFE9A3;--tint:#1F7A37;--tint-press:#1A6A2F;--label:#1D1D1F;--label2:#55555B;--label3:#6E6E73;--fill:rgba(118,118,128,.12);--fill2:rgba(118,118,128,.2);--sep:rgba(60,60,67,.16);--danger:#C62828;--sun:#FFCC33}

.wall{background-color:#FFEDB0;background-image:radial-gradient(60% 70% at 0% 0%,#FFF6D6 0%,rgba(255,246,214,0) 70%),radial-gradient(55% 60% at 100% 8%,#FFD966 0%,rgba(255,217,102,0) 68%),radial-gradient(50% 55% at 92% 100%,#B9E2B2 0%,rgba(185,226,178,0) 70%),radial-gradient(45% 50% at 8% 100%,#FFE08A 0%,rgba(255,224,138,0) 70%),linear-gradient(160deg,#FFF1C2 0%,#FFE39A 55%,#F4E7A0 100%);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Inter",system-ui,sans-serif;color:#1D1D1F;-webkit-font-smoothing:antialiased;letter-spacing:-0.01em}
.rnd{font-family:ui-rounded,"SF Pro Rounded","Nunito",-apple-system,sans-serif}
.glass{background:rgba(255,255,255,.56);-webkit-backdrop-filter:blur(28px) saturate(180%);backdrop-filter:blur(28px) saturate(180%);border:0.5px solid rgba(255,255,255,.75);box-shadow:inset 0 1px 0 rgba(255,255,255,.85),0 1px 2px rgba(90,70,0,.06),0 10px 30px rgba(90,70,0,.12)}
.glass-thick{background:rgba(252,251,246,.82);-webkit-backdrop-filter:blur(40px) saturate(180%);backdrop-filter:blur(40px) saturate(180%);border:0.5px solid rgba(255,255,255,.8);box-shadow:inset 0 1px 0 rgba(255,255,255,.9),0 20px 60px rgba(70,55,0,.22)}
.tile{background:#FFFFFF;box-shadow:0 1px 2px rgba(60,45,0,.06),0 6px 16px rgba(90,70,0,.08)}
.statusbar{height:24px;flex-shrink:0;box-sizing:border-box;padding:0 22px;display:flex;align-items:center;justify-content:space-between;font-size:14px;font-weight:600;color:#1D1D1F;font-variant-numeric:tabular-nums}
.btn{font-family:inherit;border:none;cursor:pointer;-webkit-tap-highlight-color:transparent;transition:transform .2s cubic-bezier(.2,.9,.3,1),background-color .2s,opacity .2s}
.btn:active{transform:scale(.96)}
.btn-tint{background:#1F7A37;color:#FFFFFF}
.btn-tint:hover{background:#18652D}
.btn-fill{background:rgba(118,118,128,.12);color:#1D1D1F}
.btn-plain{background:transparent;color:#1E7A36}
.segctl{display:flex;padding:2px;border-radius:10px;background:rgba(118,118,128,.14)}
.segctl .seg{flex:1 1 0;min-height:36px;border-radius:8px;border:none;background:transparent;color:#1D1D1F;font:600 14px/1 -apple-system,"SF Pro Text","Inter",sans-serif;cursor:pointer;transition:background-color .2s,box-shadow .2s}
.segctl .seg[aria-pressed="true"],.segctl .seg[aria-selected="true"]{background:#FFFFFF;box-shadow:0 3px 8px rgba(0,0,0,.12),0 0 0 0.5px rgba(0,0,0,.04)}
.group{border-radius:12px;background:rgba(255,255,255,.78);overflow:hidden}
.row{min-height:48px;box-sizing:border-box;padding:0 16px;display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:16px;color:#1D1D1F;text-decoration:none;position:relative}
.row+.row::before{content:"";position:absolute;top:0;left:16px;right:0;height:0.5px;background:rgba(60,60,67,.2)}
.footnote{font-size:13px;line-height:1.35;color:#6E6E73}
.sechead{font-size:13px;font-weight:600;color:#6E6E73;padding:0 16px}
::selection{background:rgba(31,122,55,.22);color:#1D1D1F}
:focus-visible{outline:3px solid rgba(31,122,55,.55);outline-offset:2px}
a{color:#1E7A36}
button{font-family:inherit;-webkit-tap-highlight-color:transparent}
@media (prefers-reduced-motion: reduce){.btn,.btn:active{transition:none;transform:none}}

</style>
<style>
/* Kartu Bicara app — shared layout. Tablet stage 1194x834 scaled to fit. Single light look (child app), explicit colors. */
:root{color-scheme:light;--panel:#FFFCF2;--panel-line:rgba(120,95,0,.14);--ok:#1F7A37;--warn:#B26A00}
html,body{height:100%}
body{margin:0;background:#F4E7A0;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Inter",system-ui,sans-serif;color:#1D1D1F}
#viewport{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;overflow:clip;background:#EADB92}
#stage{width:1194px;height:834px;flex:none;position:relative;overflow:hidden;transform-origin:center center}
#stage.wall{display:flex;flex-direction:column}
#stage{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
#stage input,#stage textarea,#stage select,#stage [contenteditable]{-webkit-user-select:text;user-select:text;-webkit-touch-callout:default}
#stage img{-webkit-user-drag:none}
#screen{position:relative;flex:1;min-height:0;display:flex;flex-direction:column}
#narrow{display:none;position:fixed;left:0;right:0;bottom:0;padding:8px max(16px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));background:#1D1D1F;color:#FFFFFF;font-size:13px;text-align:center;z-index:50}
@media (max-width:760px){#narrow{display:block}}
/* nav bar */
.nav{height:56px;flex-shrink:0;display:flex;align-items:center;gap:12px;padding:0 20px;box-sizing:border-box}
.nav h1{margin:0;font-size:28px;font-weight:700;letter-spacing:-.02em;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.back{display:inline-flex;align-items:center;gap:2px;min-height:44px;padding:0 8px 0 2px;border:none;background:transparent;color:#1E7A36;font-size:17px;font-weight:500;cursor:pointer;border-radius:10px}
.back svg{width:22px;height:22px}
.pill{display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:0 16px;border-radius:999px;font-size:15px;font-weight:600}
/* symbol tiles */
.spr{background-repeat:no-repeat;flex:none}
.sym{display:block;flex:none;border-radius:10px;overflow:hidden;background:#FFFFFF}
.sym img{width:100%;height:100%;object-fit:cover;display:block}
.sym.blank{display:flex;align-items:center;justify-content:center;background:#F1EEDF;color:#6E6E73;font-weight:800}
.card{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:4px;box-sizing:border-box;padding:6px 6px 8px;border-radius:16px;background:#FFFFFF;border:2px solid transparent;box-shadow:0 1px 2px rgba(60,45,0,.08),0 4px 10px rgba(90,70,0,.08);cursor:pointer;user-select:none;-webkit-user-select:none;touch-action:manipulation;font-family:inherit;color:#1D1D1F}
.card .lbl{font-family:ui-rounded,"SF Pro Rounded","Nunito",-apple-system,sans-serif;font-weight:800;line-height:1.1;text-align:center;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card:active{transform:scale(.96)}
.flyer{position:absolute;z-index:40;pointer-events:none;margin:0}
/* modal sheet + toast (KB.sheet / KB.toast) */
.scrim{position:absolute;inset:0;z-index:30;background:rgba(40,30,0,.28);display:flex;align-items:center;justify-content:center;animation:kbFade .18s ease-out}
.sheet{width:560px;max-width:calc(100% - 48px);max-height:calc(100% - 64px);display:flex;flex-direction:column;border-radius:22px;background:#FCFBF6;box-shadow:0 20px 60px rgba(70,55,0,.3);overflow:hidden;animation:kbRise .26s cubic-bezier(.16,1,.3,1)}
.sheet-h{display:flex;align-items:center;gap:12px;padding:16px 20px 8px}
.sheet-h h2{margin:0;flex:1;font-size:20px;font-weight:700}
.sheet-b{padding:8px 20px 12px;overflow:auto;min-height:0;font-size:15px;line-height:1.45;color:#1D1D1F}
.sheet-f{display:flex;gap:10px;justify-content:flex-end;padding:12px 20px 18px}
.sheet-f .btn{min-height:44px;padding:0 18px;border-radius:12px;font-size:16px;font-weight:600}
.btn-danger{background:#C62828;color:#FFFFFF}
.toast{position:absolute;left:50%;bottom:28px;transform:translateX(-50%);z-index:45;background:#1D1D1F;color:#FFFFFF;padding:12px 18px;border-radius:14px;font-size:15px;font-weight:500;max-width:70%;text-align:center;animation:kbRise .24s cubic-bezier(.16,1,.3,1)}
.badge{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 10px;border-radius:999px;font-size:13px;font-weight:600;background:rgba(118,118,128,.14);color:#55555B}
.badge.awan{background:#E6F3E4;color:#1F7A37}
.badge.lokal{background:#FFF1C7;color:#7A5300}
input.field,select.field,textarea.field{font:inherit;font-size:16px;min-height:44px;box-sizing:border-box;padding:0 12px;border-radius:10px;border:1px solid rgba(60,60,67,.22);background:#FFFFFF;color:#1D1D1F}
textarea.field{padding:10px 12px;min-height:120px;width:100%}
.toggle{width:51px;height:31px;border-radius:16px;border:none;background:rgba(120,120,128,.24);position:relative;cursor:pointer;flex:none;transition:background-color .2s}
.toggle::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#FFFFFF;box-shadow:0 2px 4px rgba(0,0,0,.2);transition:transform .2s cubic-bezier(.2,.9,.3,1)}
.toggle[aria-checked="true"]{background:#34C759}
.toggle[aria-checked="true"]::after{transform:translateX(20px)}
@keyframes kbFade{from{opacity:0}to{opacity:1}}
@keyframes kbRise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.toast{animation-name:kbToast}
@keyframes kbToast{from{opacity:0;transform:translate(-50%,10px)}to{opacity:1;transform:translate(-50%,0)}}
@media (prefers-reduced-motion: reduce){.scrim,.sheet,.toast{animation:none}.card:active{transform:none}.toggle,.toggle::after{transition:none}}

</style>
<style>
/* Kartu Bicara — layar Komunikasi. Pemilik: Pekerja B. Semua selector berawalan .km- */
.km{flex:1;min-height:0;display:flex;flex-direction:column;position:relative;color:#1D1D1F;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.km button{font-family:inherit;-webkit-tap-highlight-color:transparent}
.km-ic{display:inline-flex;flex:none}
.km-ic svg{width:100%;height:100%;display:block}
#stage.km-on .toast{bottom:calc(var(--km-dock,168px) + 36px)}

/* ---------- bar atas ---------- */
.km-top{height:64px;flex:none;box-sizing:border-box;padding:0 20px;display:flex;align-items:center;gap:12px}
.km-who{display:flex;flex-direction:column;justify-content:center;min-width:0;max-width:210px}
.km-name{margin:0;font-family:ui-rounded,"SF Pro Rounded","Nunito",-apple-system,sans-serif;font-size:28px;line-height:1.05;font-weight:900;letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.km-sub{font-size:14px;font-weight:500;color:#55555B;white-space:nowrap}
.km-pill{height:52px;flex:none;box-sizing:border-box;padding:0 18px;border:.5px solid var(--panel-line);border-radius:999px;background:var(--panel);color:#1D1D1F;font-size:16px;font-weight:600;white-space:nowrap;cursor:pointer;display:flex;align-items:center;gap:8px;box-shadow:0 1px 2px rgba(90,70,0,.06),0 6px 16px rgba(90,70,0,.10);touch-action:manipulation;transition:transform .2s cubic-bezier(.2,.9,.3,1),background-color .2s}
.km-pill:active{transform:scale(.96)}
.km-awalan{width:112px;flex:none;box-sizing:border-box;padding:8px 6px 10px;border-radius:24px;background:#FFFFFF;border:2px solid rgba(46,125,79,.35);box-shadow:0 1px 2px rgba(60,45,0,.08),0 4px 10px rgba(90,70,0,.08);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;cursor:pointer;color:#1D1D1F;font-family:inherit;touch-action:manipulation;transition:transform .2s cubic-bezier(.2,.9,.3,1)}
.km-awalan:active{transform:scale(.96)}
.km-awallbl{font-family:ui-rounded,"SF Pro Rounded","Nunito",-apple-system,sans-serif;font-weight:800;font-size:17px;line-height:1}
.km-awalpic{display:block;border-radius:12px;overflow:hidden}
.km-awalan .km-ic,.km-pendin .km-ic{color:#1F7A37}
.km-urgs{margin-left:auto;display:flex;gap:8px;min-width:0}
.km-urg{height:52px;flex:none;padding:0 14px 0 5px;border:.5px solid var(--panel-line);border-radius:999px;background:var(--panel);color:#1D1D1F;font-size:16px;font-weight:600;white-space:nowrap;cursor:pointer;display:flex;align-items:center;gap:7px;box-shadow:0 1px 2px rgba(90,70,0,.06),0 6px 16px rgba(90,70,0,.10);touch-action:manipulation;transition:transform .2s cubic-bezier(.2,.9,.3,1),background-color .2s}
.km-urg:active{transform:scale(.95)}
.km-urg.on{background:#FFE2E0;transform:scale(1.05)}
.km-urglbl{max-width:112px;overflow:hidden;text-overflow:ellipsis}
.km-urgsym{width:42px;height:42px;border-radius:50%;background:#FFE4E1;display:flex;align-items:center;justify-content:center;flex:none;overflow:hidden}
.km-urgsym .sym{background:transparent}
.km-pend{position:relative;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none}
.km-pendin{position:relative;display:flex;align-items:center;gap:8px}

/* ---------- tab ---------- */
.km-tabswrap{height:62px;flex:none;box-sizing:border-box;padding:0 20px;display:flex;align-items:center;justify-content:center}
.km-tabswrap[hidden]{display:none}
.km-tabs{height:56px;box-sizing:border-box;padding:4px;border-radius:999px;display:flex;max-width:100%;overflow-x:auto;overflow-y:hidden;background:var(--panel);border:.5px solid var(--panel-line);box-shadow:0 1px 2px rgba(90,70,0,.06),0 8px 24px rgba(90,70,0,.10);scrollbar-width:none;overscroll-behavior-x:contain}
.km-tabs::-webkit-scrollbar{display:none}
.km-tabs.km-ml{-webkit-mask-image:linear-gradient(90deg,transparent 0,#000 34px);mask-image:linear-gradient(90deg,transparent 0,#000 34px)}
.km-tabs.km-mr{-webkit-mask-image:linear-gradient(270deg,transparent 0,#000 34px);mask-image:linear-gradient(270deg,transparent 0,#000 34px)}
.km-tabs.km-ml.km-mr{-webkit-mask-image:linear-gradient(90deg,transparent 0,#000 34px,#000 calc(100% - 34px),transparent 100%);mask-image:linear-gradient(90deg,transparent 0,#000 34px,#000 calc(100% - 34px),transparent 100%)}
.km-tab{flex:none;height:48px;padding:0 12px 0 4px;border:none;border-radius:999px;background:transparent;color:#1D1D1F;font-size:14px;font-weight:500;letter-spacing:-.01em;white-space:nowrap;cursor:pointer;display:flex;align-items:center;gap:5px;touch-action:manipulation;transition:background-color .2s,box-shadow .2s,color .2s}
.km-tab[aria-selected="true"]{background:#FFFFFF;color:#1E7A36;font-weight:700;box-shadow:0 2px 8px rgba(0,0,0,.12),inset 0 0 0 2.5px var(--tc,#1F7A37)}
.km-tabico{width:40px;height:40px;border-radius:12px;background:#FFFFFF;background:color-mix(in srgb,var(--tc,#A0B6BC) 20%,#FFFFFF);display:flex;align-items:center;justify-content:center;flex:none}
.km-tabico .sym{background:transparent;border-radius:8px}
.km-tabini{font-weight:800;font-size:18px;color:#1D1D1F}

/* ---------- halaman buku ---------- */
.km-main{flex:1;min-height:0;box-sizing:border-box;padding:0 20px 10px;display:flex}
.km-book{flex:1;min-width:0;min-height:0;display:flex;flex-direction:column;border-radius:26px;background:var(--panel);border:.5px solid var(--panel-line);box-shadow:0 1px 2px rgba(90,70,0,.06),0 8px 24px rgba(90,70,0,.10);overflow:hidden;position:relative}
.km-bookbody{flex:1;min-height:0;position:relative}
.km-scroll{position:absolute;inset:0;box-sizing:border-box;padding:14px;overflow-x:hidden;overflow-y:auto;overscroll-behavior:contain;touch-action:pan-y;scrollbar-width:thin;scrollbar-color:rgba(60,60,67,.35) transparent}
.km-scroll.km-fixed{touch-action:none}
.km-scroll:focus-visible{outline-offset:-4px}
/* kolom dan jarak kolom diatur JS (layoutGrid); kartu berukuran tetap sama dengan slot strip */
.km-grid{display:grid;grid-template-columns:repeat(auto-fill,116px);justify-content:center;column-gap:10px;row-gap:18px;align-content:start}
.km-grid.km-in-r{animation:kmInR .3s cubic-bezier(.16,1,.3,1)}
.km-grid.km-in-l{animation:kmInL .3s cubic-bezier(.16,1,.3,1)}
.km-card,.km-chip{box-sizing:border-box;min-width:0;justify-content:flex-start;padding:6px 3px 8px;touch-action:inherit;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none;transition:transform .18s cubic-bezier(.2,.9,.3,1),box-shadow .18s,opacity .18s}
.km-card .sym,.km-chip .sym{background:transparent}
.km-card .sym.blank,.km-chip .sym.blank{background:rgba(255,255,255,.8);border-radius:14px;font-size:30px;color:#55555B;font-family:ui-rounded,"SF Pro Rounded","Nunito",-apple-system,sans-serif}
.km-chip .sym.blank{font-size:20px}
.km-card img{pointer-events:none;-webkit-user-drag:none}
.km-card.km-armed{transform:scale(1.07);z-index:3;box-shadow:0 0 0 3px #FFCC33,0 12px 24px rgba(90,70,0,.28)}
.km-scroll.km-drag .km-card:active{transform:scale(.97)}
.km-scroll.km-drag .km-card.km-armed:active{transform:scale(1.07)}
.km-card.km-lifted{opacity:.3}
.km-card.km-say{box-shadow:0 0 0 3px #FFCC33,0 4px 10px rgba(90,70,0,.12)}
.km-grid.km-wrap .lbl{white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;line-height:1.08;min-height:2.16em;overflow:hidden;text-wrap:balance}
.km-grid.km-wrap .km-card{justify-content:flex-start}
.km-gridempty{display:flex;align-items:center;justify-content:center;min-height:100%}
.km-emptypg{grid-column:1/-1;width:100%;min-height:220px;display:flex;align-items:center;justify-content:center;text-align:center}
.km-emptypg p{margin:0;max-width:420px;font-size:18px;line-height:1.4;color:#55555B}
.km-fade{position:absolute;left:0;right:0;bottom:0;height:72px;background:linear-gradient(to top,var(--panel) 12%,rgba(255,252,242,0));pointer-events:none;opacity:0;transition:opacity .2s}
.km-bookbody.km-hasmore .km-fade{opacity:1}
.km-more{position:absolute;right:18px;bottom:10px;height:44px;padding:0 16px 0 18px;border:none;border-radius:22px;background:#1F7A37;color:#FFFFFF;font-size:15px;font-weight:600;display:flex;align-items:center;gap:6px;cursor:pointer;box-shadow:0 6px 16px rgba(31,122,55,.35);touch-action:manipulation}
.km-more[hidden]{display:none}
.km-pager{height:60px;flex:none;box-sizing:border-box;padding:0 12px;display:flex;align-items:center;justify-content:space-between;gap:12px;border-top:.5px solid var(--panel-line);background:rgba(255,255,255,.45)}
.km-pager[hidden]{display:none}
.km-pgbtn{width:76px;height:48px;flex:none;border:none;border-radius:24px;background:rgba(118,118,128,.14);color:#1D1D1F;display:flex;align-items:center;justify-content:center;cursor:pointer;touch-action:manipulation;transition:transform .2s cubic-bezier(.2,.9,.3,1),opacity .2s}
.km-pgbtn:active{transform:scale(.94)}
.km-pgbtn[aria-disabled="true"]{opacity:.35;cursor:default}
.km-pgmid{display:flex;align-items:center;gap:14px;min-width:0}
.km-dots{display:flex;align-items:center}
.km-dot{width:44px;height:48px;padding:0;border:none;background:transparent;display:flex;align-items:center;justify-content:center;cursor:pointer;touch-action:manipulation}
.km-dot i{display:block;width:12px;height:12px;border-radius:6px;background:#8A8A8E;transition:width .25s cubic-bezier(.2,.9,.3,1),background-color .2s}
.km-dot[aria-current="page"] i{width:30px;background:var(--tc,#1F7A37);box-shadow:0 0 0 1.5px rgba(29,29,31,.35)}
.km-pglabel{font-size:15px;font-weight:600;color:#3C3C43;white-space:nowrap;font-variant-numeric:tabular-nums}

/* ---------- dock kalimat ---------- */
.km-dock{flex:none;box-sizing:border-box;margin:0 20px 12px;padding:10px;border-radius:32px;background:var(--panel);border:.5px solid var(--panel-line);box-shadow:0 1px 2px rgba(90,70,0,.06),0 8px 24px rgba(90,70,0,.10);display:flex;gap:10px;align-items:stretch;position:relative;transition:box-shadow .35s,transform .35s cubic-bezier(.2,.9,.3,1),background-color .25s}
.km-dock.km-offer{transform:translateY(-4px);box-shadow:0 0 0 3px rgba(255,204,51,.75),0 18px 40px rgba(90,70,0,.2)}
.km-dock.km-done{box-shadow:0 0 0 3px rgba(31,122,55,.45),0 10px 30px rgba(90,70,0,.12)}
.km-dock.km-over{transform:translateY(-4px);background:#FFFBE0;box-shadow:0 0 0 4px #FFCC33,0 18px 40px rgba(90,70,0,.25)}

    try { if (location.hash !== '#' + name) history.replaceState(null, '', '#' + name); } catch (e) {}
  };
  KB.current = () => current;

  /* ---------- choose child ---------- */
  KB.selectChild = async (id) => {
    const ch = KB.state.children.find((c) => c.id === id);
    if (!ch) return false;
    KB.state.child = ch;
    KB.state.book = await KB.store.getBook(id);
    try { localStorage.setItem('kb.lastChild', id); } catch (e) {}
    KB.emit('child', ch); KB.emit('book', KB.state.book);
    return true;
  };
  // Persist changes to the current child / book. Screens call these; never write the store directly for these two.
  KB.updateChild = async (patch) => {
    const ch = KB.state.child; if (!ch) return;
    Object.assign(ch, patch);
    await KB.store.updateChild(ch.id, patch);
    KB.emit('child', ch);
  };
  KB.saveBook = (mutator) => {
    const b = KB.state.book; if (!b) return;
    if (mutator) mutator(b);
    b.updatedAt = Date.now();
    KB.store.saveBook(KB.state.child.id, b);
    KB.emit('book', b);
  };

  /* ---------- stage scaling ---------- */
  KB.fit = () => {
    const st = document.getElementById('stage'); if (!st) return;
    const vw = window.innerWidth, vh = window.innerHeight;
    const k = Math.min(vw / 1194, vh / 834);
    // panggung melebar/memanjang mengikuti sisa layar supaya tak ada pinggiran kosong (tablet 16:10, mode tegak)
    st.style.width = vw / k + 'px'; st.style.height = vh / k + 'px';
    st.style.transform = 'scale(' + k + ')';
    KB.scale = k;
  };
  window.addEventListener('resize', KB.fit);

  /* ---------- boot ---------- */
  KB.boot = async () => {
    KB.fit();
    const res = await fetch('data/cards.json');
    KB.setData(await res.json());
    await KB.store.init();
    KB.state.children = await KB.store.listChildren();
    const badge = document.getElementById('modeBadge');
    if (badge) { badge.className = 'badge ' + KB.store.mode; badge.textContent = KB.store.mode === 'awan' ? 'Tersimpan di awan' : 'Mode lokal'; }
    let last = null; try { last = localStorage.getItem('kb.lastChild'); } catch (e) {}
    const want = (location.hash || '').slice(1);
    if (last && (await KB.selectChild(last)) && want && want !== 'anak') KB.go(want);
    else KB.go('anak');
    window.addEventListener('hashchange', () => { const n = location.hash.slice(1); if (n && n !== current) KB.go(n); });
  };
})();

<script>
/* Kartu Bicara — data layer. Owned by the foreman.
   Cloud mode ('awan'): claude.use('db') + 'assets' + 'downloads' + 'user'.
   Local mode ('lokal'): same API on localStorage (with in-memory fallback), used when db is null (local file, preview).

   db layout (all docs are plain JSON objects):
     children/{childId}            { name, voice, ragam, delay, select, pin, pinSet, stripSlots, cardSize, target, createdAt, contoh? }
     books/{childId}               { v, tabs:[{id,name,color,icon,starters,prompt,pages:[[key..]..]}], starters:[key..], custom:{key:{label,cat,photo?,sym?}}, labels:{key:label}, updatedAt }
     logs/{childId}/days/{YYYY-MM-DD}  { date, events:[{ts, keys:[..], labels:[..], tab, kind:'kalimat'|'langsung'|'tukar', starter:bool}] }
   Photos: cloud -> assets.upload(blob) id, referenced as card.photo = 'asset:<id>'; local -> card.photo = 'data:image/jpeg;base64,...'
*/
(function () {
  const KB = (window.KB = window.KB || {});
  const S = {};
  KB.store = S;
  let db = null, assets = null, downloads = null, user = null;
  S.mode = 'lokal';
  S.canEdit = true;

  /* ---------- local backend ---------- */
  const LKEY = 'kb.app.v1';
  let mem = null;
  const loadLocal = () => {
    if (mem) return mem;
    try { mem = JSON.parse(localStorage.getItem(LKEY) || 'null'); } catch (e) { mem = null; }
    if (!mem) mem = { children: {}, books: {}, logs: {} };
    return mem;
  };
  let lt = null;
  const flushLocal = () => { clearTimeout(lt); lt = setTimeout(() => { try { localStorage.setItem(LKEY, JSON.stringify(mem)); } catch (e) {} }, 250); };
  const clone = (o) => JSON.parse(JSON.stringify(o));
  const today = (d) => { d = d || new Date(); const p = (n) => String(n).padStart(2, '0'); return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()); };
  S.today = today;

  S.init = async () => {
    try {
      if (window.claude && window.claude.use) {
        db = await window.claude.use('db');
        if (db) {
          [assets, downloads, user] = await Promise.all([window.claude.use('assets'), window.claude.use('downloads'), window.claude.use('user')]);
          S.mode = 'awan';
          try { S.canEdit = user ? await user.canEdit() : true; } catch (e) { S.canEdit = true; }
        }
      }
    } catch (e) { db = null; }
    if (!db) {
      loadLocal();
      if (!Object.keys(mem.children).length) seedLocal();
    }
    S.hasDownloads = !!downloads;
    S.hasAssets = S.mode === 'lokal' || !!assets;
    return S.mode;
  };

  // Example data for local mode only (cloud examples are seeded into the store by Claude, never hardcoded).
  function seedLocal() {
    const mk = (id, name) => { mem.children[id] = Object.assign(KB.defaultChild(name), { contoh: true }); mem.books[id] = KB.defaultBook(); };
    mk('contoh_raka', 'Raka (contoh)');
    mk('contoh_sinta', 'Sinta (contoh)');
    mem.children.contoh_sinta.voice = 'gadis';
    // a week of example usage for Raka so the report has something to show
    const sentences = [['saya', 'mau', 'bola'], ['saya', 'mau', 'makan'], ['saya', 'mau', 'minum'], ['tolong'], ['saya', 'lihat', 'mobil'], ['saya', 'mau', 'bola', 'merah'], ['istirahat'], ['saya', 'mau', 'musik'], ['tidak_mau'], ['saya', 'dengar', 'suara']];
    mem.logs.contoh_raka = {};
    for (let d = 6; d >= 0; d--) {
      const day = new Date(Date.now() - d * 864e5); const id = today(day); const n = 14 + ((d * 7) % 13) + (6 - d) * 3;
      const events = [];
      for (let i = 0; i < n; i++) {
        const keys = sentences[(i * 3 + d) % sentences.length];
        const ts = new Date(day); ts.setHours(8 + Math.floor(i / 4), (i * 13) % 60, 0, 0);
        if (ts.getTime() > Date.now()) ts.setTime(Date.now() - (n - i) * 7 * 60000);
        events.push({ ts: ts.getTime(), keys, labels: keys, tab: keys.length > 2 ? 'f4' : 'bt', kind: keys.length > 1 ? 'kalimat' : 'langsung', starter: keys[0] === 'saya', contoh: true });
      }
      mem.logs.contoh_raka[id] = { date: id, events };
    }
    flushLocal();
  }

  /* ---------- children ---------- */
  S.listChildren = async () => {
    if (db) {
      const q = await db.collection('children').get();
      return q.docs.map((d) => Object.assign({ id: d.id }, d.data())).sort((a, b) => (a.createdAt || 0) - (b.createdAt || 0));
    }
    return Object.keys(mem.children).map((id) => Object.assign({ id }, clone(mem.children[id]))).sort((a, b) => (a.createdAt || 0) - (b.createdAt || 0));
  };
  // Live updates of the children list (cloud only; local calls back once).
  S.onChildren = (cb) => {
    if (db) return db.collection('children').onSnapshot((q) => cb(q.docs.map((d) => Object.assign({ id: d.id }, d.data()))), () => {});
    S.listChildren().then(cb); return () => {};
  };
  S.addChild = async (name) => {
    const id = KB.uid('c_');
    const child = KB.defaultChild(name);
    const book = KB.defaultBook();
    if (db) { await db.doc('children/' + id).set(child); await db.doc('books/' + id).set(book); }
    else { mem.children[id] = child; mem.books[id] = book; flushLocal(); }
    return Object.assign({ id }, child);
  };
  S.updateChild = async (id, patch) => {
    if (db) { await db.doc('children/' + id).update(patch); return; }
    Object.assign(mem.children[id], clone(patch)); flushLocal();
  };
  S.deleteChild = async (id) => {
    clearTimeout(bookTimers[id]);
    Object.keys(dayCache).forEach((ck) => { if (ck.indexOf(id + '/') === 0) { clearTimeout(dayTimers[ck]); delete dayCache[ck]; } });
    if (db) {
      const q = await db.collection('logs/' + id + '/days').get();
      await Promise.all(q.docs.map((d) => db.doc('logs/' + id + '/days/' + d.id).delete()));
      await db.doc('books/' + id).delete(); await db.doc('children/' + id).delete();
      return;
    }
    delete mem.children[id]; delete mem.books[id]; delete mem.logs[id]; flushLocal();
  };

  /* ---------- book ---------- */
  S.getBook = async (id) => {
    if (db) {
      const s = await db.doc('books/' + id).get();
      if (s.exists) return clone(s.data());
      const b = KB.defaultBook(); await db.doc('books/' + id).set(b); return b;
    }
    if (!mem.books[id]) { mem.books[id] = KB.defaultBook(); flushLocal(); }
    return clone(mem.books[id]);
  };
  const bookTimers = {};
  // Debounced full write of the book document (last-writer-wins).
  S.saveBook = (id, book) => {
    clearTimeout(bookTimers[id]);
    const body = clone(book);
    bookTimers[id] = setTimeout(async () => {
      try {
        if (db) await db.doc('books/' + id).set(body);
        else { mem.books[id] = body; flushLocal(); }
        KB.emit('saved', { what: 'book' });
      } catch (e) { KB.emit('saveError', e); KB.toast && KB.toast(e && e.code === 'quota_exceeded' ? 'Penyimpanan penuh. Hapus foto atau anak yang tidak dipakai.' : 'Perubahan belum tersimpan. Periksa koneksi lalu coba lagi.'); }
    }, 500);
  };

  /* ---------- usage log ---------- */
  const dayCache = {}; const dayTimers = {};
  // evt: {keys:[..], labels:[..], tab, kind:'kalimat'|'langsung', starter:bool}. ts is added here.
  S.logSentence = async (childId, evt) => {
    const id = today(); const ck = childId + '/' + id;
    const e = Object.assign({ ts: Date.now() }, evt);
    if (!db) {
      mem.logs[childId] = mem.logs[childId] || {};
      const d = (mem.logs[childId][id] = mem.logs[childId][id] || { date: id, events: [] });
      d.events.push(e); flushLocal(); KB.emit('logged', e); return;
    }
    if (!dayCache[ck]) {
      const s = await db.doc('logs/' + childId + '/days/' + id).get();
      dayCache[ck] = s.exists ? clone(s.data()) : { date: id, events: [] };
    }
    dayCache[ck].events.push(e);
    KB.emit('logged', e);
    clearTimeout(dayTimers[ck]);
    dayTimers[ck] = setTimeout(() => { db.doc('logs/' + childId + '/days/' + id).set(dayCache[ck]).catch(() => KB.toast && KB.toast('Catatan pemakaian belum tersimpan.')); }, 1200);
  };
  // Returns [{date, events}] for the last `days` days (inclusive of today), newest last.
  S.getLogs = async (childId, days) => {
    days = days || 30;
    const from = today(new Date(Date.now() - (days - 1) * 864e5));
    let out = [];
    if (db) {
      const q = await db.collection('logs/' + childId + '/days').get();
      out = q.docs.filter((d) => d.id >= from).map((d) => clone(d.data()));
      Object.keys(dayCache).forEach((ck) => { if (ck.indexOf(childId + '/') === 0) { const d = dayCache[ck]; out = out.filter((x) => x.date !== d.date).concat([clone(d)]); } });
    } else {
      const L = mem.logs[childId] || {};
      out = Object.keys(L).filter((k) => k >= from).map((k) => clone(L[k]));
    }
    return out.sort((a, b) => (a.date < b.date ? -1 : 1));
  };

  /* ---------- photos ---------- */
  // Resize to max 480px JPEG, then upload (cloud) or inline (local). Returns the value to store in card.photo.
  S.savePhoto = async (file) => {
    const blob = await resize(file, 480);
    if (db) {
      if (!assets) throw { code: 'not_granted', message: 'Unggah foto hanya untuk akun yang bisa mengedit.' };
      const r = await assets.upload(blob, { type: 'image/jpeg' });
      return 'asset:' + r.id;
    }
    return await new Promise((res) => { const fr = new FileReader(); fr.onload = () => res(fr.result); fr.readAsDataURL(blob); });
  };
  S.photoSrc = (v) => (v && v.indexOf('asset:') === 0 ? '/_blob/' + v.slice(6) : v);
  function resize(file, max) {
    return new Promise((res, rej) => {
      const url = URL.createObjectURL(file); const img = new Image();
      img.onload = () => {
        const k = Math.min(1, max / Math.max(img.width, img.height));
        const c = document.createElement('canvas'); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
        const g = c.getContext('2d'); g.fillStyle = '#FFFFFF'; g.fillRect(0, 0, c.width, c.height); g.drawImage(img, 0, 0, c.width, c.height);
        URL.revokeObjectURL(url);
        c.toBlob((b) => (b ? res(b) : rej({ code: 'invalid_request', message: 'Foto tidak bisa dibaca.' })), 'image/jpeg', 0.85);
      };
      img.onerror = () => { URL.revokeObjectURL(url); rej({ code: 'invalid_request', message: 'File ini bukan gambar yang bisa dibaca.' }); };
      img.src = url;
    });
  }

  /* ---------- backup ---------- */
  S.exportChild = async (childId) => {
    const kids = await S.listChildren(); const child = kids.find((c) => c.id === childId);
    const book = await S.getBook(childId); const logs = await S.getLogs(childId, 3650);
    return { format: 'kartu-bicara-backup', v: 1, exportedAt: new Date().toISOString(), child, book, logs };
  };
  // Saves a JSON file via the downloads capability. Returns 'saved' | 'declined' | 'unavailable'.
  S.saveFile = async (filename, text) => {
    if (!downloads) {
      // Outside claude.ai (own hosting, not framed): a normal browser download works.
      let framed = true; try { framed = window.top !== window.self; } catch (e) {}
      if (framed) return 'unavailable';
      try {
        const url = URL.createObjectURL(new Blob([text], { type: 'application/json' }));
        const a = document.createElement('a'); a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove();
        setTimeout(() => URL.revokeObjectURL(url), 2000); return 'saved';
      } catch (e) { return 'unavailable'; }
    }
    try { await downloads.save({ filename, data: text }); return 'saved'; }
    catch (e) { return e && e.code === 'declined' ? 'declined' : 'unavailable'; }
  };
  // Restores a backup as a NEW child (never overwrites an existing one). Returns the new child.
  S.importChild = async (obj) => {
    if (!obj || obj.format !== 'kartu-bicara-backup' || !obj.child || !obj.book) throw { code: 'invalid', message: 'File ini bukan cadangan Kartu Bicara.' };
    const id = KB.uid('c_');
    const child = Object.assign(KB.defaultChild(), obj.child, { createdAt: Date.now() }); delete child.id; delete child.contoh;
    child.name = (child.name || 'Anak') + ' (dipulihkan)';
    if (db) {
      await db.doc('children/' + id).set(child); await db.doc('books/' + id).set(obj.book);
      for (const d of obj.logs || []) if (d && d.date) await db.doc('logs/' + id + '/days/' + d.date).set(d);
    } else {
      mem.children[id] = child; mem.books[id] = obj.book; mem.logs[id] = {};
      (obj.logs || []).forEach((d) => { if (d && d.date) mem.logs[id][d.date] = d; }); flushLocal();
    }
    return Object.assign({ id }, child);
  };
})();

</script>
<script>
/* Kartu Bicara — audio. Owned by the foreman.
   Recorded AI voices (laki = anak laki-laki, gadis = anak perempuan, perempuan = perempuan dewasa) are clips inside a few mp4 masters.
   Cards without a clip (custom cards, relabelled cards) fall back to the browser's speech (id-ID) when it exists, else stay silent.
   API: KB.audio.play(keys, {onStep(i), after()}) ; KB.audio.stop() ; KB.audio.hasClip(key) ; KB.audio.say(text, after) */
(function () {
  const KB = (window.KB = window.KB || {});
  const A = {};
  KB.audio = A;
  const els = {};
  let runId = 0, iv = null;
  const el = (id) => {
    if (!els[id]) { try { const a = new Audio(KB.data.audio[id]); a.preload = 'auto'; els[id] = a; } catch (e) { els[id] = null; } }
    return els[id];
  };
  const voice = () => (KB.state.child && KB.state.child.voice) || 'laki';
  A.clip = (key) => {
    const book = KB.state.book || {};
    if (book.custom && book.custom[key]) return null;
    if (book.labels && book.labels[key]) return null; // relabelled: the recording would say the old word
    const V = KB.data.voice[voice()] || {};
    const aku = KB.state.child && KB.state.child.ragam === 'aku';
    const t = (aku && V[key + '@aku']) || V[key];
    return t ? { id: t[0], t0: t[1], t1: t[2] } : null;
  };
  A.hasClip = (key) => !!A.clip(key);
  A.canSpeak = () => { try { return 'speechSynthesis' in window && typeof SpeechSynthesisUtterance === 'function'; } catch (e) { return false; } };
  A.stop = () => {
    runId++; clearInterval(iv);
    Object.values(els).forEach((a) => { try { a && a.pause(); } catch (e) {} });
    try { window.speechSynthesis && window.speechSynthesis.cancel(); } catch (e) {}
  };
  A.say = (text, after) => {
    let done = false; const fin = () => { if (done) return; done = true; after && after(); };
    try {
      if (!A.canSpeak()) throw 0;
      const u = new SpeechSynthesisUtterance(text); u.lang = 'id-ID'; u.rate = 0.95;
      u.onend = fin; u.onerror = fin;
      window.speechSynthesis.speak(u);
      setTimeout(fin, 600 + text.length * 140); // never hang if the engine stays silent
    } catch (e) { setTimeout(fin, 350); }
  };
  A.play = (keys, opts) => {
    opts = opts || {};
    A.stop();
    const run = runId;
    // Awalan gabungan tanpa rekaman di suara ini (mis. saya_mau pada suara gadis) diputar per kata: saya + mau.
    const B = KB.state.book || {};
    const parts = (k) => {
      const ps = k.split('_');
      const own = (B.custom && B.custom[k]) || (B.labels && B.labels[k]);
      return ps.length > 1 && !own && !A.clip(k) && ps.every(A.hasClip) ? ps : [k];
    };
    const seq = []; keys.forEach((k, slot) => parts(k).forEach((p) => seq.push([p, slot])));
    const step = (i) => {
      if (run !== runId) return;
      if (i >= seq.length) { opts.after && opts.after(); return; }
      if (!i || seq[i - 1][1] !== seq[i][1]) opts.onStep && opts.onStep(seq[i][1]);
      const key = seq[i][0];
      const next = () => setTimeout(() => step(i + 1), 160);
      const cl = A.clip(key);
      const c = KB.card(key);
      let done = false;
      const fallback = () => { if (done) return; done = true; clearInterval(iv); A.say(c ? c.label : key, next); };
      const a = cl && el(cl.id);
      if (!a) { fallback(); return; }
      const go = () => {
        if (run !== runId) return;
        try { a.currentTime = cl.t0; } catch (e) { fallback(); return; }
        const p = a.play(); if (p && p.catch) p.catch(fallback);
        const t0 = Date.now(); clearInterval(iv);
        iv = setInterval(() => {
          if (done) return;
          if (a.currentTime >= cl.t1) { done = true; clearInterval(iv); a.pause(); next(); }
          else if (Date.now() - t0 > 4000) fallback();
        }, 20);
      };
      if (a.readyState >= 1) go();
      else { a.addEventListener('loadedmetadata', go, { once: true }); try { a.load(); } catch (e) { fallback(); } }
    };
    step(0);
  };
})();

</script>
<script>
/* Kartu Bicara — layar Komunikasi (buku komunikasi yang dipakai anak). Pemilik: Pekerja B.
   Mendaftarkan KB.screens.komunikasi. Selector CSS berawalan .km- (lihat css/komunikasi.css).

   Ringkasan perilaku:
   - Bar atas: nama anak, tombol Awalan, kartu langsung (tanpa strip), tombol Pendamping (ketuk -> KB.unlock -> panel).
   - Tab dari book.tabs, halaman dari tab.pages (grid kartu yang bisa digulir, ‹ ›, titik, geser).
   - Strip kalimat child.stripSlots slot; awalan tab terpasang otomatis di depan strip.
   - Mode pilih child.select: tap | drag | both (default drag = pertukaran gambar ala PECS: kartu ditekan lalu diseret anak ke strip).
     drag: ketuk tidak bersuara (petunjuk saja; suara hanya dari Bicara); seret langsung memunculkan kartu bayangan di bawah jari dan menempel ke slot saat dilepas
     di strip. Halaman yang muat layar: seret langsung ke arah mana pun. Halaman yang bisa digulir (ukuran besar / banyak kartu):
     tahan ±150 ms (kartu sedikit membesar + getar) sebelum diseret supaya gulir satu jari tetap jalan; Lihat lebih banyak dan
     tombol halaman selalu ada. Lepas di luar strip: kartu kembali; geseran horizontal sentuh = pindah halaman.
   - Geometri: slot strip = kartu buku (geo(): lebar gambar+12, tinggi gambar+label); bila n slot tidak muat selebar jalur,
     semuanya diskalakan sebanding (tanpa gulir horizontal). Halaman 15 kartu ukuran Sedang = 8 kolom x 2 baris tanpa gulir.
   - Bicara: awalan -> jeda PECS (hanya permintaan "mau") -> sisa kalimat; dicatat ke KB.store.logSentence.
   - Tab bermode 'single' (PECS Fase I, pertukaran fisik): SATU kartu besar per halaman, tanpa strip dan tombol Bicara
     (diganti baris petunjuk pendamping = tab.prompt). Ketuk kartu = pertukaran: dibacakan, animasi "diserahkan",
     dicatat sebagai kind 'tukar'. Mode seret tidak berlaku di tab ini. */
(function () {
  const KB = window.KB;
  const h = KB.h;

  /* ---------- konstanta ---------- */
  const SIZE = { s: { px: 76, font: 15 }, m: { px: 104, font: 19 }, l: { px: 150, font: 25 } };
  // Geometri kartu buku = geometri slot strip (satu sumber). Lebar kartu = gambar + 12 (border 2x2, padding 3x2, sisa 2px);
  // tinggi = border 2x2 + padding 6/8 + gambar + jarak 4 + label satu baris (line-height 1.1).
  const geo = (size) => { const z = SIZE[size] || SIZE.m; const lh = Math.ceil(z.font * 1.1); return { px: z.px, font: z.font, lh, cw: z.px + 12, ch: 4 + 14 + z.px + 4 + lh }; };
  const GAP_MIN = 8, GAP_MAX = 18; // jarak kolom kartu buku

        S.strip = nh.concat(S.strip.slice(n)); S.arrive = nh.indexOf(key); S.arriveDrop = true;

      function activate(card, viaKeyboard) {

      /* ---------- halaman Awalan Kalimat ---------- */
      function awalKeys() {
        const out = [];

      }

        [top, tabsWrap, main, dock].forEach((el) => { el.inert = false; });
        try { awalReturn && awalReturn.isConnected && awalReturn.focus(); } catch (e) {}
      }
      // Awalan bisa sampai 2 kartu ("saya" + "mau"). Kartu gabungan ("saya mau") menggantikan semuanya;
      // memilih awalan yang sudah terpasang melepasnya; awalan ke-3 menggantikan yang kedua.
      const AWAL_MAX = 2;
      const isCombo = (k) => labelOf(k).trim().split(/\s+/).length > 1; // label dua kata, mis. "saya mau"

        if (!key) return [];

      function onBook() {

        S.strip = S.strip.filter((k) => KB.card(k));

      }
      function onChild() {

      }
      unsubs.push(KB.on('book', onBook), KB.on('book', paintAwal), KB.on('child', onChild));

      /* ---------- mulai ---------- */
      buildTop(); buildTabs(); renderBook(); renderStrip();

      return function cleanup() {
        alive = false;
        timers.forEach((t) => clearTimeout(t)); timers.clear();
        unsubs.forEach((f) => { try { f(); } catch (e) {} });

    }
  };
})();

<script>
/* Kartu Bicara — Kunci anak (KB.unlock) + layar Mode Edit (KB.screens.edit) + pengaturan anak.
   Owner: pekerja C. Semua perubahan buku lewat KB.saveBook, pengaturan anak lewat KB.updateChild. */
(function () {
  const KB = window.KB;
  const h = KB.h;
  const LOCK_MS = 5 * 60 * 1000;
  const CHECK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
  const BOOK_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4.5A1.5 1.5 0 016.5 3H18v14H6.5A1.5 1.5 0 005 18.5v-14z"/><path d="M5 18.5A2.5 2.5 0 007.5 21H18v-4"/><path d="M9 7.5h5"/></svg>';
  const SIZE_NAME = { s: 'Kecil', m: 'Sedang', l: 'Besar' };

  const MODE_NOTE = {
    grid: 'Beberapa kartu per halaman. Kartu bisa disusun menjadi kalimat di strip.',
    single: 'Satu kartu besar per halaman, tanpa strip kalimat dan tombol Bicara. Ketuk kartu = pertukaran fisik (PECS Fase I), dibacakan dan dicatat di laporan.'
  };
  const SEL_DESC = {
    tap: 'Anak mengetuk kartu untuk memilihnya.',
    drag: 'Anak menyeret kartu ke strip kalimat.',
    both: 'Anak boleh mengetuk atau menyeret kartu.'
  };
  const view = { sel: null, page: 0 }; // sel: tab id | '@starters' | '@child'
  let unlocked = { id: null, until: 0 };
  const closers = new Set(); // every sheet opened from here, so leaving the screen can close them
  let leaving = false; // true while cleanup closes sheets: a dismissed lock sheet must not trigger navigation then
  const closeAll = () => { leaving = true; try { closers.forEach((c) => c()); } finally { leaving = false; } };

  // Escape closes only the topmost sheet (KB.sheet alone would close every stacked one, e.g. a picker over the tab sheet).
  window.addEventListener('keydown', (e) => {

  }
  const btn = (label, icon, kind, fn, attrs) => h('button', Object.assign({ type: 'button', class: 'btn ed-btn ' + kind, onclick: fn }, attrs || {}), icon ? KB.ico(icon, 18) : null, label);
  const ib = (icon, label, disabled, fn, fid) => h('button', { type: 'button', class: 'ed-ib', 'aria-label': label, title: label, disabled: disabled ? true : null, 'data-fid': fid || null, onclick: fn }, KB.ico(icon, 20));

  /* ---------- book helpers ---------- */
  function referenced(b) {
    const s = new Set();

  }

    const after = referenced(b);
    Object.keys(b.custom || {}).forEach((k) => { if (before.has(k) && !after.has(k)) delete b.custom[k]; });
  }
  function fixBook(b) {
    if (!b) return;
    if (!Array.isArray(b.tabs)) b.tabs = [];
    if (!b.custom) b.custom = {};
    if (!b.labels) b.labels = {};

  /* =====================================================================

  // KB.unlock(then[, onCancel]): asks for the child's 4-digit code, then calls then(). Not asked again for 5 minutes (memory only).
  KB.unlock = function (then, onCancel) {
    if (KB.unlock.isOpen()) { if (then) then(); return; }
    const child = KB.state.child;
    const want = () => String((KB.state.child && KB.state.child.pin) || '1234');
    let ok = false, pad = null, close = null;
    pad = makePad((code) => {
      if (code === want()) {
        ok = true; unlocked = { id: childId(), until: Date.now() + LOCK_MS };
        close(); if (then) then();
      } else pad.shake('Kode salah, coba lagi');
    });
    const body = h('div', { class: 'ed-unlock' },
      h('p', { class: 'ed-lead', text: 'Masukkan kode 4 digit untuk membuka menu pendamping.' }),
      h('p', { class: 'ed-note', text: 'Kunci anak mencegah anak membuka menu tanpa sengaja. Ini bukan pengaman data.' }),
      pad.el,
      child && child.pinSet ? null : h('p', { class: 'ed-note ed-pinhint', text: 'Kode awal 1234. Ganti di Pengaturan anak.' }));
    close = sheet({ title: 'Kunci anak', body, width: 420, actions: [], onClose: () => { pad.destroy(); if (!ok && !leaving && onCancel) onCancel(); } }, 'ed-s-lock');
  };
  KB.unlock.isOpen = () => unlocked.id === childId() && unlocked.id != null && Date.now() < unlocked.until;
  KB.unlock.lock = () => { unlocked = { id: null, until: 0 }; };

  /* =====================================================================
     PUSTAKA SIMBOL (dipakai oleh Tambah kartu, ikon tab, awalan, ganti gambar)
     ===================================================================== */
  function libraryPane(o) {
    const sel = [];
    let q = '', filt = 'all';
    const book = () => KB.state.book;
    const customKeys = () => (o.noCustom ? [] : Object.keys(book().custom || {}));
    const counts = {}, groups = { 1: 0, 2: 0, 3: 0, 4: 0 };
    let kur = 0;
    KB.allCards().forEach((c) => { if (c.cat === 'benda' && c.group) groups[c.group]++; else { counts[c.cat] = (counts[c.cat] || 0) + 1; kur++; } });
    const opt = (v, t) => h('option', { value: v, text: t });
    const select = h('select', { class: 'field ed-filter', 'aria-label': 'Filter kategori', onchange: () => { filt = select.value; draw(); } },
      opt('all', 'Semua (' + (KB.allCards().length + customKeys().length) + ')'),
      h('optgroup', { label: 'Kurikulum' }, opt('k', 'Semua kurikulum (' + kur + ')'), KB.data.categories.filter((c) => counts[c.id]).map((c) => opt('k:' + c.id, c.name + ' (' + counts[c.id] + ')'))),
      h('optgroup', { label: 'Kata Benda VB II' }, opt('g', 'Semua grup (' + (groups[1] + groups[2] + groups[3] + groups[4]) + ')'), [1, 2, 3, 4].map((g) => opt('g:' + g, 'Grup ' + g + ' (' + groups[g] + ')'))),
      customKeys().length ? h('optgroup', { label: 'Kartu sendiri' }, opt('u', 'Kartu sendiri (' + customKeys().length + ')')) : null);
    const search = h('input', { class: 'field ed-q', type: 'search', placeholder: 'Cari menurut nama, mis. bola', 'aria-label': 'Cari simbol menurut nama', autocomplete: 'off', oninput: () => { q = norm(search.value); draw(); } });
    const count = h('p', { class: 'ed-count', 'aria-live': 'polite' });
    let shown = []; // keys selectable in current results (excludes "Sudah ada")
    const multi = o.multi !== false;
    const bulk = h('button', { type: 'button', class: 'btn btn-tint ed-btn ed-all', hidden: true, onclick: () => {
      const all = shown.length && shown.every((k) => sel.indexOf(k) >= 0);
      if (all) { for (let i = sel.length - 1; i >= 0; i--) if (shown.indexOf(sel[i]) >= 0) sel.splice(i, 1); }
      else shown.forEach((k) => { if (sel.indexOf(k) < 0) sel.push(k); });
      paint(); syncBulk(); if (o.onChange) o.onChange(sel.slice());
    } });
    const longNote = h('p', { class: 'ed-note ed-long', hidden: true, text: 'Banyak kartu dipilih: halaman akan jadi panjang dan bisa digulir.' });
    function syncBulk() {
      bulk.hidden = !multi || !shown.length;
      const all = shown.length > 0 && shown.every((k) => sel.indexOf(k) >= 0);
      bulk.textContent = all ? 'Batalkan pilihan' : 'Pilih semua';
      bulk.setAttribute('aria-pressed', String(all));
      bulk.setAttribute('aria-label', all ? 'Batalkan pilihan untuk ' + shown.length + ' simbol yang tampil' : 'Pilih semua ' + shown.length + ' simbol yang tampil');
      longNote.hidden = !(o.longNote && multi && shown.length > 60);
    }
    const grid = h('div', { class: 'ed-pgrid' });
    const pool = () => {
      let L = KB.allCards().map((c) => c.key);
      const cat = (k) => base(k);
      if (filt === 'u') return customKeys();
      if (filt === 'k') L = L.filter((k) => cat(k).cat !== 'benda');
      else if (filt.indexOf('k:') === 0) L = L.filter((k) => cat(k).cat === filt.slice(2) && cat(k).cat !== 'benda');
      else if (filt === 'g') L = L.filter((k) => cat(k).cat === 'benda');
      else if (filt.indexOf('g:') === 0) L = L.filter((k) => cat(k).cat === 'benda' && String(cat(k).group) === filt.slice(2));
      else L = customKeys().concat(L);
      return L;
    };
    const match = (k) => {
      if (!q) return true;
      const c = KB.card(k); const b0 = base(k);
      const t = norm(c ? c.label : k) + ' ' + norm(k.replace(/_/g, ' ')) + ' ' + (b0 ? norm(b0.label) : '');
      return q.split(' ').every((w) => t.indexOf(w) >= 0);
    };
    const paint = () => grid.querySelectorAll('.ed-pick').forEach((n) => { const on = sel.indexOf(n.dataset.key) >= 0; n.classList.toggle('on', on); n.setAttribute('aria-pressed', String(on)); });
    function toggle(k) {
      const i = sel.indexOf(k);
      if (o.multi === false) { sel.length = 0; if (i < 0) sel.push(k); } else if (i >= 0) sel.splice(i, 1); else sel.push(k);
      paint(); syncBulk(); if (o.onChange) o.onChange(sel.slice());
    }
    function tile(k) {
      const dis = o.exclude && o.exclude.has(k);
      const lb = cardLabel(k);
      const el = KB.cardEl(k, { px: 72, font: 13, attrs: { 'aria-pressed': String(sel.indexOf(k) >= 0), 'aria-label': dis ? lb + ', sudah ada' : lb } });
      el.classList.add('ed-pick');
      if (sel.indexOf(k) >= 0) el.classList.add('on');
      el.appendChild(h('span', { class: 'ed-ck', 'aria-hidden': 'true', html: CHECK }));
      if (dis) { el.disabled = true; el.classList.add('dis'); el.appendChild(h('span', { class: 'ed-have', text: 'Sudah ada' })); }
      else el.addEventListener('click', () => toggle(k));
      return el;
    }
    function draw() {
      let list = pool().filter(match);
      if (q) list = list.map((k, i) => ({ k, i, p: norm(cardLabel(k)).indexOf(q) === 0 ? 0 : 1 })).sort((a, b) => a.p - b.p || a.i - b.i).map((x) => x.k);
      grid.textContent = '';
      list.forEach((k) => grid.appendChild(tile(k)));
      shown = list.filter((k) => !(o.exclude && o.exclude.has(k))); syncBulk();
      count.textContent = list.length ? list.length + ' simbol' : 'Tidak ada simbol yang cocok. Coba kata lain atau pilih "Semua".';
    }
    draw();
    const el = h('div', { class: 'ed-lib' },
      h('div', { class: 'ed-libbar' }, h('label', { class: 'ed-search' }, KB.ico('search', 18), search), select),
      h('div', { class: 'ed-countrow' }, count, bulk), longNote, grid);
    return { el, selected: () => sel.slice(), focus: () => search.focus() };
  }

  // Generic single-purpose library picker sheet. o: {title, multi, exclude, noCustom, confirm, onDone(keys)}

  /* ---------- foto sendiri ---------- */
  function photoPane(o) {
    let file = null, url = null, busy = false;
    const input = h('input', { type: 'file', accept: 'image/*', class: 'ed-file', tabindex: '-1', 'aria-label': 'Pilih foto' });

    const pick = h('button', { type: 'button', class: 'btn btn-fill ed-btn', onclick: () => input.click() }, KB.ico('photo', 20), 'Pilih foto');
    const name = h('input', { class: 'field', maxlength: '24', placeholder: 'mis. Bola biru', autocomplete: 'off', 'aria-required': 'true', oninput: () => { name.classList.remove('ed-bad'); setMsg(''); } });
    const cats = [{ id: 'foto', name: 'Foto sendiri (tanpa kategori)' }].concat(KB.data.categories.filter((c) => c.id !== 'lama' && c.id !== 'pembuka'));
    const cat = h('select', { class: 'field' }, cats.map((c) => h('option', { value: c.id, text: c.name })));
    const go = h('button', { type: 'button', class: 'btn btn-tint ed-btn ed-go' }, 'Tambahkan kartu');
    const setBusy = (b) => {
      busy = b;
      [go, pick, name, cat].forEach((n) => { n.disabled = b; });
      go.textContent = '';
      if (b) go.append(h('span', { class: 'ed-spin', 'aria-hidden': 'true' }), 'Menyimpan foto…'); else go.append('Tambahkan kartu');
      el.setAttribute('aria-busy', String(b));
    };
    input.addEventListener('change', () => {
      const f = input.files && input.files[0];
      if (!f) return;
      file = f; input.value = '';
      if (url) URL.revokeObjectURL(url);
      url = URL.createObjectURL(f);
      const img = h('img', { src: url, alt: 'Pratinjau foto' });
      img.onerror = () => { file = null; prev.replaceChildren(holder()); setMsg('Foto ini tidak bisa dibaca. Coba foto lain (JPG atau PNG).'); };
      prev.replaceChildren(img); setMsg('');
    });
    go.addEventListener('click', async () => {
      if (busy) return;
      const label = clean(name.value);
      if (!file) { setMsg('Pilih foto dulu.'); pick.focus(); return; }
      if (!label) { setMsg('Isi nama kartu. Nama ini tampil di bawah gambar dan dibacakan.'); name.classList.add('ed-bad'); name.focus(); return; }
      setMsg(''); setBusy(true);
      let val;

      setBusy(false);
      o.onDone({ label, cat: cat.value, photo: val });
    });
    const el = h('div', { class: 'ed-photo' },
      h('div', { class: 'ed-photo-top' }, prev,
        h('div', { class: 'ed-photo-fields' },
          h('div', {}, pick, input),
          h('label', { class: 'ed-lab' }, h('span', { text: 'Nama kartu (wajib)' }), name),
          h('label', { class: 'ed-lab' }, h('span', { text: 'Kategori (menentukan warna kartu)' }), cat))),
      msg,
      h('div', { class: 'ed-foot' }, h('span', { class: 'ed-note', text: 'Foto disimpan di buku ini. Kartu foto dibacakan oleh suara perangkat, bukan rekaman.' }), go));
    return { el, destroy: () => { if (url) URL.revokeObjectURL(url); } };
  }

  /* =====================================================================
     SHEET: KARTU
     ===================================================================== */
  function openCard(key) {
    const b = KB.state.book; const t0 = curTab(b); const tid = t0.id; const pidx = view.page;
    const custom = !!(b.custom && b.custom[key]);
    let close = null;
    const pgNow = () => { const tt = tabOf(b, tid); return tt ? tt.pages[pidx] : null; };
    const pic = h('div', { class: 'ed-card-pic' });
    const drawPic = () => { if (KB.card(key)) pic.replaceChildren(KB.symEl(key, 96)); };
    const msg = h('p', { class: 'ed-msg', role: 'alert' });
    const input = h('input', { class: 'field', maxlength: '30', autocomplete: 'off', 'aria-label': 'Nama kartu', value: cardLabel(key), onchange: () => commitLabel() });
    const restore = h('button', { type: 'button', class: 'btn btn-plain ed-btn ed-restore', onclick: () => { KB.saveBook((bb) => { delete bb.labels[key]; }); input.value = cardLabel(key); msg.textContent = ''; sync(); drawPic(); } });
    function commitLabel() {
      const c = KB.card(key); if (!c) return;
      const v = clean(input.value);
      if (v === c.label) return;
      if (!custom) {
        const bc = base(key);
        if (!v || (bc && v === bc.label)) { if (b.labels && b.labels[key]) KB.saveBook((bb) => { delete bb.labels[key]; }); }
        else KB.saveBook((bb) => { bb.labels[key] = v; });
        input.value = cardLabel(key);
      } else {
        if (!v) { input.value = c.label; msg.textContent = 'Nama kartu tidak boleh kosong.'; return; }
        KB.saveBook((bb) => { bb.custom[key].label = v; });
      }

    const pos = h('span', { class: 'ed-pos', 'aria-live': 'polite' });

    const right = btn('Geser ke kanan', 'right', 'btn-fill', () => shift(1));
    function shift(d) {
      const p = pgNow(); const i = p ? p.indexOf(key) : -1; const j = i + d;
      if (i < 0 || j < 0 || j >= p.length) return;
      KB.saveBook((bb) => { const pp = tabOf(bb, tid).pages[pidx]; const x = pp[i]; pp[i] = pp[j]; pp[j] = x; });

      const opts = [];

      if (custom && !elsewhere) {

          restore)),
      note, msg, customBox,
      h('div', { class: 'ed-box' }, h('div', { class: 'ed-boxh' }, 'Posisi di halaman ', pos), h('div', { class: 'ed-btnrow' }, left, right)),
      h('div', { class: 'ed-box' }, h('div', { class: 'ed-boxh', text: 'Pindah ke halaman lain' }), h('div', { class: 'ed-inline' }, dest, moveBtn)),

  }

  /* =====================================================================
     SHEET: TAB (baru / ubah)
     ===================================================================== */
  function openTab(id) {

<script>

(function () {

      const seg = (items, cur, label, tabs, onPick) => {
        const btns = items.map((it) => h('button', Object.assign({ type: 'button', class: 'seg', dataset: { v: String(it.id) }, text: it.label, onclick: () => onPick(it.id) }, tabs ? { role: 'tab', 'aria-selected': String(it.id === cur) } : { 'aria-pressed': String(it.id === cur) })));
        const el = h('div', { class: 'segctl lp-segctl', role: tabs ? 'tablist' : 'group', 'aria-label': label }, btns);
        el.set = (v) => btns.forEach((b) => b.setAttribute(tabs ? 'aria-selected' : 'aria-pressed', String(b.dataset.v === String(v))));
        return el;
      };
      const rangeSeg = seg([{ id: 7, label: '7 hari' }, { id: 30, label: '30 hari' }], UI.range, 'Rentang waktu', false, (v) => { if (v === UI.range) return; UI.range = v; rangeSeg.set(v); load(); });
      const viewSeg = seg([{ id: 'pakai', label: 'Pemakaian' }, { id: 'cadangan', label: 'Data & cadangan' }], view, 'Bagian laporan', true, (v) => { view = v; viewSeg.set(v); paint(false); });
      const head = h('div', { class: 'lp-head' },
        h('div', { class: 'nav lp-nav' }, h('button', { type: 'button', class: 'back', onclick: () => KB.go('komunikasi') }, KB.ico('back', 22), 'Komunikasi')),
        h('div', { class: 'lp-titlerow' },
          h('h1', { class: 'rnd', text: 'Laporan ' + name }), child.contoh ? h('span', { class: 'lp-contoh', text: 'Contoh data' }) : null,
          h('span', { class: 'lp-spread' }), rangeSeg, viewSeg));
      const body = h('div', { class: 'lp-body', role: 'tabpanel' });
      root.classList.add('lp'); root.appendChild(head); root.appendChild(body);

      /* --- bagian Pemakaian --- */
      function pakai() {
        const M = model;
        if (!M) return h('div', { class: 'lp-loading', role: 'status', text: loadErr ? '' : 'Memuat laporan…' }, loadErr ? [h('p', { text: loadErr }), h('button', { type: 'button', class: 'btn btn-tint lp-btn', onclick: load, text: 'Coba lagi' })] : null);
        if (!M.total) return h('div', { class: 'lp-empty' },
          h('span', { class: 'lp-empty-ico', 'aria-hidden': 'true' }, KB.ico('chart', 34)),
          h('p', { class: 'lp-empty-lead' }, h('strong', { text: 'Belum ada kalimat tercatat.' }), ' Setiap kali anak menekan Bicara, kalimatnya tercatat di sini.'),
          h('button', { type: 'button', class: 'btn btn-tint lp-btn', onclick: () => KB.go('komunikasi'), text: 'Buka Komunikasi' }));
        const cc = chartCard(M); chartWrap = cc.wrap;
        const note = M.hasContoh ? h('div', { class: 'lp-note' }, h('i', { 'aria-hidden': 'true' }), h('span', { text: 'Termasuk contoh data: sebagian kalimat di rentang ini adalah contoh, bukan pemakaian anak yang sebenarnya.' })) : null;
        return h('div', { class: 'lp-page' }, summaryEl(M), note,
          h('div', { class: 'lp-grid' }, cc.el, recentEl(M), topCardsEl(M), h('div', { class: 'lp-stack' }, awalanEl(M), perTabEl(M))));
      }

      /* --- bagian Data & cadangan --- */
      function cadangan() {
        const awan = KB.store.mode === 'awan';
        const edit = canEdit();
        const result = h('div', { class: 'lp-result', role: 'status', hidden: true });
        const setResult = (kind, msg, action) => { result.hidden = !msg; result.className = 'lp-result ' + kind; result.innerHTML = ''; if (msg) { result.appendChild(h('span', { text: msg })); if (action) result.appendChild(action); } };
        const restorer = makeRestorer(() => setResult('', ''), (r) => {
          if (dead) return;
          if (r.ok) {
            const c = r.child;
            setResult('ok', 'Dipulihkan sebagai “' + c.name + '”. Anak ini ada di daftar anak; data yang ada tidak diubah.', h('button', { type: 'button', class: 'btn btn-fill lp-mini', text: 'Buka anak ini', onclick: async () => { await KB.selectChild(c.id); KB.go('komunikasi'); } }));
            KB.toast('Cadangan dipulihkan sebagai “' + c.name + '”.', 3600);
          } else setResult('err', 'Tidak bisa dipulihkan. ' + r.message);
        });

        const exportBtn = h('button', { type: 'button', class: 'btn btn-tint lp-btn', text: 'Simpan cadangan' });
        exportBtn.addEventListener('click', async () => {
          exportBtn.disabled = true; setResult('', '');
          try {
            const obj = await KB.store.exportChild(child.id);
            const text = JSON.stringify(obj);
            const fname = 'kartu-bicara-' + fileSafe(child.name) + '-' + KB.store.today() + '.json';
            const r = await KB.store.saveFile(fname, text);
            if (r === 'saved') KB.toast('Cadangan tersimpan: ' + fname, 3600);
            else if (r === 'declined') KB.toast('Penyimpanan cadangan dibatalkan. Ketuk lagi bila ingin menyimpannya.');
            else copySheet(fname, text);
          } catch (e) { KB.toast('Cadangan belum bisa dibuat. ' + (errMsg(e) || 'Coba lagi.')); }
          exportBtn.disabled = false;
        });
        const act = (title, sub, ctl) => h('div', { class: 'row lp-act' }, h('div', { class: 'lp-acttxt' }, h('b', { text: title }), h('span', { text: sub })), ctl);
        const delBtn = h('button', { type: 'button', class: 'btn btn-danger lp-btn', text: 'Hapus…', disabled: !edit, onclick: () => unlock(async () => {
          const ok = await KB.confirm('Hapus data ' + name + '?', 'Profil, buku kartu, dan semua catatan pemakaian anak ini akan dihapus dari ' + (awan ? 'akun klinik' : 'perangkat ini') + '. Tindakan ini tidak bisa dibatalkan. Simpan cadangan dulu bila datanya mungkin masih diperlukan.', 'Hapus data', true);
          if (!ok) return;
          try {
            const id = child.id;
            await KB.store.deleteChild(id);
            try { if (localStorage.getItem('kb.lastChild') === id) localStorage.removeItem('kb.lastChild'); } catch (e) {}
            KB.state.child = null; KB.state.book = null;
            await refreshChildren();
            KB.go('anak'); KB.toast('Data ' + name + ' sudah dihapus.');
          } catch (e) { KB.toast('Data belum terhapus. ' + (errMsg(e) || 'Coba lagi.')); }
        }) });
        return h('div', { class: 'lp-page lp-page-narrow' },
          h('div', { class: 'lp-cell' }, secHead('Cadangan ' + name),
            h('div', { class: 'lp-card group' },
              act('Simpan cadangan anak ini', 'Satu file .json berisi pengaturan, buku kartu, dan seluruh catatan pemakaian. Simpan di tempat yang aman: isinya data pribadi anak.', exportBtn),
              act('Pulihkan dari cadangan', 'Dibuat sebagai anak baru bernama “… (dipulihkan)”. Data yang sudah ada tidak ditimpa.', h('button', { type: 'button', class: 'btn btn-fill lp-btn', text: 'Pilih file…', disabled: !edit, onclick: restorer.open })),
              result),
            restorer.input,
            !edit ? h('p', { class: 'footnote lp-foot', text: 'Akun ini hanya bisa melihat. Memulihkan dan menghapus data memerlukan izin mengedit.' }) : null),
          h('div', { class: 'lp-cell' }, secHead('Tempat data disimpan'), modeCard(),
            h('p', { class: 'footnote lp-foot', text: awan ? 'Foto kartu buatan sendiri tersimpan terpisah di akun; file cadangan hanya memuat rujukannya, jadi pulihkan di akun yang sama.' : 'Cadangan memuat foto kartu buatan sendiri, jadi file bisa besar. Data peramban yang dibersihkan ikut menghapus semua data anak.' })),
          h('div', { class: 'lp-cell' }, secHead('Hapus'),
            h('div', { class: 'lp-card group' }, act('Hapus data anak ini', 'Menghapus profil, buku kartu, dan catatan pemakaian. Tidak bisa dibatalkan.', delBtn))));
      }

      // Sheet cadangan teks bila perangkat tidak bisa menyimpan file langsung.
      function copySheet(fname, text) {
        const ta = h('textarea', { class: 'field lp-json', readonly: true, rows: '8', 'aria-label': 'Isi cadangan (JSON)', spellcheck: 'false' });
        ta.value = text;
        ta.addEventListener('focus', () => { ta.select(); ta.scrollTop = 0; });
        const body = h('div', null,
          h('p', { style: { margin: '0 0 10px' }, text: 'Perangkat ini tidak bisa menyimpan file langsung. Salin teks di bawah, tempel ke berkas baru (misalnya di aplikasi Catatan), lalu simpan dengan nama ' + fname + '. Teks ini bisa dipulihkan lewat “Pilih file…” setelah disimpan sebagai .json.' }),
          ta, h('p', { class: 'footnote', style: { margin: '8px 0 0' }, text: fmt(Math.round(text.length / 1024)) + ' KB · berisi data pribadi anak, jangan dibagikan sembarangan.' }));
        const fallback = () => { ta.focus(); ta.select(); ta.setSelectionRange(0, ta.value.length); let ok = false; try { ok = document.execCommand && document.execCommand('copy'); } catch (e) {} KB.toast(ok ? 'Teks tersalin.' : 'Teks sudah dipilih. Tekan lama lalu pilih Salin.', 3200); };
        KB.sheet({ title: 'Simpan cadangan', width: 640, body, actions: [
          { label: 'Tutup', kind: 'fill' },
          { label: 'Salin', kind: 'tint', onClick: () => {
            try { navigator.clipboard.writeText(text).then(() => KB.toast('Tersalin. Tempel ke berkas lalu simpan sebagai .json.', 3600), fallback); }
            catch (e) { fallback(); }
            return false;
          } }] });
      }

      /* --- render & muat --- */
      function paint(keep) {
        const lpBody = body; const sy = keep === false ? 0 : lpBody.scrollTop;
        const lst = lpBody.querySelector('.lp-list'); const ly = lst ? lst.scrollTop : 0;
        rangeSeg.classList.toggle('lp-hide', view !== 'pakai');
        lpBody.innerHTML = ''; chartWrap = null;
        lpBody.appendChild(view === 'pakai' ? pakai() : cadangan());
        lpBody.scrollTop = sy;
        const l2 = lpBody.querySelector('.lp-list'); if (l2) l2.scrollTop = ly;
      }
      async function load() {
        const my = ++token;
        try {
          const n = UI.range;
          const logs = await KB.store.getLogs(child.id, n * 2);
          if (dead || my !== token) return;
          model = aggregate(logs, n, KB.state.child || child, KB.state.book); loadErr = null;
        } catch (e) { if (dead || my !== token) return; if (!model) loadErr = 'Laporan belum bisa dimuat. Periksa koneksi lalu coba lagi.'; else KB.toast('Laporan belum bisa diperbarui.'); }
        if (view === 'pakai') paint();
      }
      paint(); load();
      return () => { dead = true; clearTimeout(timer); unsub.forEach((f) => f()); document.removeEventListener('pointerdown', outside); root.classList.remove('lp'); };
    }
  };
})();

</script>
<script>
  (function () {
    const p = (n) => String(n).padStart(2, '0');
    const tick = () => { const d = new Date(); const c = document.getElementById('clock'); if (c) c.textContent = p(d.getHours()) + '.' + p(d.getMinutes()); };
    tick(); setInterval(tick, 30000);
    KB.boot().catch((e) => { console.error(e); document.getElementById('screen').textContent = 'Aplikasi gagal dimuat. Muat ulang halaman.'; });
  })();

  /* Tekan lama/geser di Android memunculkan menu "Salin" (menu gambar, seleksi, seret bawaan). Seret kartu memakai pointer
     events sendiri, jadi ketiganya dimatikan di seluruh dokumen, kecuali di kolom isian. */
  ['contextmenu', 'selectstart', 'dragstart'].forEach((ev) => document.addEventListener(ev, (e) => {
    const t = e.target.nodeType === 1 ? e.target : e.target.parentElement; // selectstart bisa menunjuk simpul teks
    if (!(t && t.closest('input,textarea,select,[contenteditable]'))) e.preventDefault();
  }));

  /* Layar penuh pada sentuhan pertama di tablet: baris alamat Chrome tak bisa disembunyikan dengan cara lain.
     Bila layar penuh ditutup (gestur kembali), sentuhan berikutnya memasangnya lagi. */
  (function () {
    const el = document.documentElement;
    const req = el.requestFullscreen || el.webkitRequestFullscreen;
    if (!req || !matchMedia('(pointer: coarse)').matches || matchMedia('(display-mode: fullscreen)').matches) return;
    const go = () => {
      if (document.fullscreenElement || document.webkitFullscreenElement) return;
      Promise.resolve(req.call(el, { navigationUI: 'hide' }))
        .then(() => screen.orientation && screen.orientation.lock && screen.orientation.lock('landscape'))
        .catch(() => {}); // ditolak peramban: tetap jalan seperti biasa
    };
    // pointerup sentuhan dan click sama-sama dihitung gestur pengguna; click menangkap stylus/mouse
    document.addEventListener('pointerup', go, { passive: true });
    document.addEventListener('click', go, { passive: true });
  })();
</script>
